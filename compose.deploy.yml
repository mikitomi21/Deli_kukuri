services:

  proxy:
    restart: always
    mem_limit: 128m
    ports:
      # Listen on port 80, default for HTTP, necessary to redirect to HTTPS
      - "80:80"
      # Listen on port 443, default for HTTPS
      - "443:443"
    volumes:
      # Mount the volume to store the certificates
      - traefik-certificates:/certificates
      # Własne certyfikaty (opcjonalnie): /opt/dzwonilek/certs + tls.yml — patrz docs/11 §1.8
      - ./certs:/certs-custom:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Redirect all HTTP traffic to HTTPS
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Store the Let's Encrypt certificates in the mounted volume
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      # Use the TLS Challenge for Let's Encrypt
      - --certificatesresolvers.le.acme.tlschallenge=true
      # Własne certyfikaty (opcjonalnie): dynamiczne pliki TLS z /opt/dzwonilek/certs
      - --providers.file.directory=/certs-custom
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    restart: always
    mem_limit: 512m

  adminer:
    restart: always
    mem_limit: 96m
    labels:
      # Route HTTPS traffic for the Adminer subdomain
      - traefik.http.routers.adminer-https.rule=Host(`adminer.${DOMAIN:?Variable not set}`)
      - traefik.http.routers.adminer-https.entrypoints=https
      - traefik.http.routers.adminer-https.tls=true
      # Use the Let's Encrypt resolver
      - traefik.http.routers.adminer-https.tls.certresolver=le

  backend:
    restart: always
    # Obraz buduje i pushuje CI (Docker Hub) — na VPS nic się nie buduje
    image: docker.io/timosch99/dzwonilek:latest
    # Migracje + seed (superuser, katalog leków) przed startem aplikacji
    # (przez "bash", bo pliki .sh w repo nie muszą mieć bitu +x)
    command:
      - bash
      - -c
      - bash scripts/prestart.sh && exec fastapi run --host 0.0.0.0 --workers 2
    environment:
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      SECRET_KEY: ${SECRET_KEY}
      PROJECT_NAME: ${PROJECT_NAME}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VOICE_SERVICE_TOKEN: ${VOICE_SERVICE_TOKEN}
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL}
      TWILIO_FROM: ${TWILIO_FROM}
      TWILIO_TO: ${TWILIO_TO}

    mem_limit: 512m
    labels:
      # Route HTTPS traffic (apex + www) — Let's Encrypt, auto-renewal.
      # UWAGA: wykupiony cert cyberfolks (Certum TLS RSA Root CA, wsp. 20.04.2027)
      # jest w /opt/dzwonilek/certs + tls.yml, ale jego root nie jest publicznie
      # zaufany (curl/Twilio failują TLS) — patrz docs/11 §1.8. Żeby go użyć:
      # usuń poniższy certresolver i rozdziel routery apex/www (docs §1.8).
      - traefik.http.routers.backend-https.rule=Host(`${DOMAIN:?Variable not set}`) || Host(`www.${DOMAIN:?Variable not set}`)
      - traefik.http.routers.backend-https.entrypoints=https
      - traefik.http.routers.backend-https.tls=true
      # Use the Let's Encrypt resolver
      - traefik.http.routers.backend-https.tls.certresolver=le

  # Voice gateway (Twilio Media Streams + OpenAI Realtime, docs/12).
  # Public: Twilio dials the media stream at https://voice.${DOMAIN} — Traefik
  # upgrades WebSockets natively; the cert MUST stay on the Let's Encrypt
  # resolver, the cyberfolks (Certum) cert fails Twilio TLS (docs/11 §1.8).
  # Internal: backend/worker reach it at http://voice:3000. Requires an A
  # record for `voice.${DOMAIN}` and PUBLIC_URL=https://voice.${DOMAIN} in
  # the server .env — replaces the ngrok tunnel profile from local dev.
  voice:
    image: docker.io/timosch99/dzwonilek:voice
    restart: always
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      PORT: "3000"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-${TWILIO_FROM_NUMBER:-}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOICE_SERVICE_TOKEN: ${VOICE_SERVICE_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 512m
    labels:
      - traefik.enable=true
      - traefik.http.services.voice.loadbalancer.server.port=3000
      - traefik.http.routers.voice-https.rule=Host(`voice.${DOMAIN:?Variable not set}`)
      - traefik.http.routers.voice-https.entrypoints=https
      - traefik.http.routers.voice-https.tls=true
      - traefik.http.routers.voice-https.tls.certresolver=le

  # Celery + Redis (docs/02-architecture.md, docs/07-scheduling-escalation.md)
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 96m

  worker:
    image: docker.io/timosch99/dzwonilek:latest
    restart: always
    command:
      - celery
      - -A
      - app.worker.celery_app
      - worker
      - --loglevel=INFO
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      SECRET_KEY: ${SECRET_KEY}
      PROJECT_NAME: ${PROJECT_NAME}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VOICE_SERVICE_TOKEN: ${VOICE_SERVICE_TOKEN}
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL}
      TWILIO_FROM: ${TWILIO_FROM}
      TWILIO_TO: ${TWILIO_TO}

    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    mem_limit: 256m

  # Jeden proces beat — nie duplikować (docs/07, decyzja 2)
  beat:
    image: docker.io/timosch99/dzwonilek:latest
    restart: always
    command:
      - celery
      - -A
      - app.worker.celery_app
      - beat
      - --loglevel=INFO
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      SECRET_KEY: ${SECRET_KEY}
      PROJECT_NAME: ${PROJECT_NAME}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      VOICE_SERVICE_TOKEN: ${VOICE_SERVICE_TOKEN}
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL}
      TWILIO_FROM: ${TWILIO_FROM}
      TWILIO_TO: ${TWILIO_TO}

    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 96m

volumes:
  # Create a volume to store the certificates, even if the container is recreated
  traefik-certificates:
