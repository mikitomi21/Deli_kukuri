name: Test & Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  test:
    name: Test (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
      # CI nie ma repozytoryjnego .env — używamy placeholderów z .env.example
      - name: Prepare compose env
        run: cp .env.example .env
      - name: Start db + mailpit
        run: docker compose up -d --wait db mailpit
      - name: Migrate DB + seed
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/app
        run: uv run bash scripts/prestart.sh
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/app
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend (typecheck + bundle)
        run: bun run --filter frontend build

  build-push:
    name: Build & push image (Docker Hub)
    needs: test
    # PR → tylko testy; merge do main → obraz do Docker Huba
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend image (z frontendem w środku)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            docker.io/timosch99/dzwonilek:${{ github.sha }}
            docker.io/timosch99/dzwonilek:latest
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max
