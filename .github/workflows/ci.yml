name: Test & Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  test:
    name: Test (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
      # CI nie ma repozytoryjnego .env — używamy placeholderów z .env.example
      - name: Prepare compose env
        run: cp .env.example .env
      - name: Start db + mailpit
        run: docker compose up -d --wait db mailpit
      - name: Migrate DB + seed
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/app
        run: uv run bash scripts/prestart.sh
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/app
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend (typecheck + bundle)
        run: bun run --filter frontend build

  build-push:
    name: Build & push image (Docker Hub)
    needs: test
    # PR → tylko testy; merge do main → obraz do Docker Huba
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build & push
        run: bash devops/build-push.sh
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
